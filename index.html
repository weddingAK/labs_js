<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 01 - Game Loop & Physics</title>
    <style>
      body {
        margin: 0;
        background: #111;
        color: #eee;
        font-family: monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
      }
      #hud {
        position: absolute;
        top: 10px;
        left: 10px;
        background: rgba(0, 0, 0, 0.7);
        padding: 10px;
        border-radius: 4px;
        font-size: 14px;
        pointer-events: none;
      }
      canvas {
        background: #222;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <div>FPS: <span id="fps">0</span></div>
      <div>Steps/s: <span id="sps">0</span></div>
      <div>Frame Time: <span id="frameTime">0</span>.00ms</div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
